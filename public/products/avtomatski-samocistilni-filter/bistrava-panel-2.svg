<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"><title>Gevor – avtomatski samočistilni filter z regulatorjem tlaka – Tehnični podatki</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef9fb"/><stop offset="1" stop-color="#d8f0f4"/></linearGradient></defs><rect width="1200" height="1200" rx="52" fill="url(#bg)"/><circle cx="1010" cy="190" r="210" fill="#20a8b8" opacity="0.12"/><circle cx="1085" cy="1030" r="280" fill="#0a2c4a" opacity="0.08"/><style>.brand{font-family:Arial,sans-serif;font-weight:700;fill:#20a8b8;letter-spacing:4px}.name{font-family:Arial,sans-serif;font-weight:750;fill:#0a2c4a}.title{font-family:Arial,sans-serif;font-weight:700;fill:#0a2c4a}.label{font-family:Arial,sans-serif;font-weight:700;fill:#20a8b8}.value{font-family:Arial,sans-serif;font-weight:600;fill:#27445e}</style><text x="86" y="105" class="brand" font-size="30">BISTRAVA</text><text x="86" y="210" class="name" font-size="54"><tspan x="86" dy="0">Gevor – avtomatski samočistilni</tspan><tspan x="86" dy="64">filter z regulatorjem tlaka</tspan></text><text x="86" y="450" class="title" font-size="38">Tehnični podatki</text><circle cx="105" cy="537" r="12" fill="#20a8b8"/><text x="140" y="545" class="label" font-size="27">FINOST FILTRACIJE</text><text x="140" y="595" class="value" font-size="31"><tspan x="140" dy="0">40 µm</tspan></text><circle cx="105" cy="717" r="12" fill="#20a8b8"/><text x="140" y="725" class="label" font-size="27">MATERIAL MREŽICE</text><text x="140" y="775" class="value" font-size="31"><tspan x="140" dy="0">Nerjavno jeklo SS316L</tspan></text><circle cx="105" cy="897" r="12" fill="#20a8b8"/><text x="140" y="905" class="label" font-size="27">PRIKLJUČEK</text><text x="140" y="955" class="value" font-size="31"><tspan x="140" dy="0">1″ ali 5/4″</tspan></text><path d="M86 1090 H1114" stroke="#86cbd4" stroke-width="2"/><text x="86" y="1145" class="value" font-size="24">Preverite